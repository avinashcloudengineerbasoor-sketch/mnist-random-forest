name: CI/CD Pipeline (Test + Build + Push GHCR)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mnist-random-forest

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install dependencies
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 5. Verify dependencies
      - name: Verify Installed Packages
        run: pip list

      # 6. Lint code
      - name: Run Flake8 Linting
        run: flake8 app tests

      # 7. Run tests
      - name: Run Pytest
        run: pytest -v

      # 8. Generate Docker tag (FIXED WAY)
      - name: Generate Image Tag
        id: tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # 9. Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 10. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ steps.tag.outputs.tag }} \
            .

      # 11. Push Docker image
      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ steps.tag.outputs.tag }}

      # 12. Verify images locally
      - name: Verify Docker Images
        run: docker images

      # 13. Success message
      - name: Success Message
        run: |
          echo "CI/CD Pipeline completed successfully"
          echo "Pushed images:"
          echo "$IMAGE_NAME:latest"
          echo "$IMAGE_NAME:${{ steps.tag.outputs.tag }}"