name: CI/CD Pipeline (Test + Build + Push ECR)

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: mnist-random-forest/random

permissions:
  contents: readgit 

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install dependencies
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 5. Verify dependencies
      - name: Verify Installed Packages
        run: pip list

      # 6. Run Flake8
      - name: Run Flake8 Linting
        run: flake8 app tests

      # 7. Run Tests
      - name: Run Pytest
        run: pytest -v

      # 8. Generate Docker Tag
      - name: Generate Image Tag
        id: tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # 9. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Set Image URI
      - name: Set Image URI
        id: image
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> $GITHUB_OUTPUT

      # 12. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.image.outputs.image }}:latest \
            -t ${{ steps.image.outputs.image }}:${{ steps.tag.outputs.tag }} \
            .

      # 13. Push Docker Images
      - name: Push Docker Images
        run: |
          docker push ${{ steps.image.outputs.image }}:latest
          docker push ${{ steps.image.outputs.image }}:${{ steps.tag.outputs.tag }}

      # 14. Verify Docker Images
      - name: Verify Docker Images
        run: docker images

      # 15. Success Message
      - name: Success Message
        run: |
          echo "CI/CD Pipeline completed successfully"
          echo "Pushed Images:"
          echo "${{ steps.image.outputs.image }}:latest"
          echo "${{ steps.image.outputs.image }}:${{ steps.tag.outputs.tag }}"