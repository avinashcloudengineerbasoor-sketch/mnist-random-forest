name: CI/CD Pipeline

on:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: mnist-api

jobs:

  test-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Pipeline Timestamp
        run: |
          echo "Pipeline started at:"
          date -u

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Python Version
        run: |
          python --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Installed Packages
        run: |
          pip list

      - name: Run Flake8 Linting
        run: |
          flake8 app tests

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Generate Docker Image Timestamp Tag
        id: timestamp
        run: |
          echo "TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
          -t $IMAGE_NAME:latest \
          -t $IMAGE_NAME:${{ env.TAG }} \
          .

      - name: Verify Docker Images
        run: |
          docker images

      - name: Print Success Message
        run: |
          echo "CI/CD pipeline completed successfully"
          echo "Docker image tags:"
          echo "$IMAGE_NAME:latest"
          echo "$IMAGE_NAME:${{ env.TAG }}"

      - name: Print Completion Timestamp
        run: |
          echo "Pipeline completed at:"
          date -u